<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>授業の申し込み｜サイエンス里山ラボ宗像</title>
<link rel="icon" href="../assets/img/favicon.png">
<!-- LINEのリッチメニュー「申し込む」から開くページ。
     つぎの授業（1つだけのとき）を入れた申込文で、公式LINEのトークを開く。
     文面は assets/js/apply.js（サイトの「LINEで申し込む」と共通）。 -->
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FFFBF1; color: #26314D;
    font: 16px/1.8 "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; width: 100%; }
  img.chara { width: 110px; height: auto; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  p { margin: 0 0 16px; color: #56607A; font-size: 14px; }
  a.btn { display: block; margin: 8px 0 18px; padding: 14px 22px; border: 3px solid #26314D; border-radius: 999px; background: #06C755; color: #fff;
    font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 #26314D; }
  pre { text-align: left; white-space: pre-wrap; background: #fff; border: 2px solid #e2e6ef; border-radius: 12px; padding: 12px; font-size: 13px; margin: 0; }
  small { display: block; margin: 6px 0 0; color: #56607A; font-size: 12px; }
</style>
</head>
<body>
<main>
  <img class="chara" src="../assets/img/chara/teal-5.webp" alt="">
  <h1>LINEを開いています…</h1>
  <p id="msg">開かないときは、下のボタンを押してください。</p>
  <a class="btn" id="go" href="https://line.me/R/ti/p/@268rzaol">LINEで申し込む</a>
  <pre id="txt"></pre>
  <small>うまく開かないときは、この文をコピーしてLINEで送ってください。</small>
</main>
<script src="../assets/js/apply.js"></script>
<script>
(async () => {
  let lineId = '@268rzaol', c = null;
  try {
    const [site, classes] = await Promise.all([
      fetch('../data/site.json', { cache: 'no-cache' }).then(r => r.json()),
      fetch('../data/classes.json', { cache: 'no-cache' }).then(r => r.json()),
    ]);
    if (site.lineId) lineId = site.lineId;
    const d = new Date(), today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const up = classes.filter(x => x.date >= today && x.status !== '中止').sort((a, b) => a.date.localeCompare(b.date));
    if (up.length === 1) c = up[0];   // つぎの授業が1つだけなら、授業名まで入れておく
  } catch (e) { /* 読めなくても、授業名なしの文で開く */ }
  const url = window.SATO_APPLY.url(lineId, c);
  document.getElementById('go').href = url;
  document.getElementById('txt').textContent = window.SATO_APPLY.text(c);
  location.replace(url);
})();
</script>
</body>
</html>
