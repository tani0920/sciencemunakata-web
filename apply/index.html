<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>授業のお申し込み｜サイエンス里山ラボ宗像</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --blue:#3B6FC1; --blue-l:#E6EEFB; --teal:#1FAFAA; --pink:#E6336F; --pink-l:#FDE6EE; --leaf:#5DB63E; --sun:#FFC53D; --sun-l:#FFF3CF;
    --ink:#26314D; --ink-2:#56607A; --paper:#FFFBF1; --line:#06C755; --line-d:#04A345; --grid:rgba(59,111,193,.075); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; font-weight: 500; color: var(--ink);
    line-height: 1.7; background: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px; -webkit-text-size-adjust: 100%; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px calc(40px + env(safe-area-inset-bottom)); }
  .logo { display: block; width: 168px; margin: 4px auto 14px; }
  .card { background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 18px 18px 20px; margin: 0 0 16px; box-shadow: 0 4px 0 rgba(38,49,77,.12); }
  h1 { font-size: 21px; line-height: 1.45; margin: 0 0 4px; font-weight: 900; }
  h2 { font-size: 16px; margin: 0 0 10px; font-weight: 900; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 99px; background: var(--sun-l); margin-bottom: 6px; }
  .pill.mem { background: var(--blue-l); color: var(--blue); }
  .group { margin: 14px 0 4px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  label.chk { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 2px solid #E3E6EE; border-radius: 14px; margin: 0 0 8px; cursor: pointer; background: #fff; }
  label.chk:has(input:checked) { border-color: var(--blue); background: var(--blue-l); }
  label.chk input { width: 22px; height: 22px; accent-color: var(--blue); flex: none; }
  label.chk b { font-size: 16px; }
  label.chk small { color: var(--ink-2); margin-left: 4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 2px; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; font: inherit; font-size: 20px; font-weight: 900; color: var(--ink); line-height: 1; }
  .stepper output { min-width: 1.6em; text-align: center; font-size: 18px; font-weight: 900; }
  input[type=text], select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); padding: 10px 12px; border: 2px solid #D5DAE5; border-radius: 12px; background: #fff; }
  textarea { min-height: 72px; resize: vertical; }
  .field { margin: 0 0 12px; }
  .field > span { display: block; font-size: 13px; font-weight: 700; margin: 0 0 4px; }
  .btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--ink); border-radius: 999px; padding: 13px 18px;
    font: inherit; font-size: 17px; font-weight: 900; color: var(--ink); background: var(--sun); box-shadow: 0 4px 0 var(--ink); text-decoration: none; cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { opacity: .5; }
  .btn.line { background: var(--line); color: #fff; border-color: var(--line-d); box-shadow: 0 4px 0 var(--line-d); }
  .btn.sub { background: #fff; font-size: 15px; padding: 10px 16px; }
  .linkbtn { background: none; border: 0; color: var(--blue); font: inherit; font-weight: 700; text-decoration: underline; padding: 6px 0; cursor: pointer; }
  .fee { background: var(--sun-l); border-radius: 14px; padding: 10px 14px; margin: 14px 0; }
  .fee b { font-size: 18px; }
  .note { font-size: 13px; color: var(--ink-2); }
  .err { background: var(--pink-l); color: #A3184A; border-radius: 12px; padding: 10px 14px; margin: 10px 0; font-weight: 700; }
  .done { text-align: center; }
  .done img { width: 150px; margin: 4px auto 8px; display: block; }
  .sum { text-align: left; background: var(--blue-l); border-radius: 14px; padding: 12px 14px; margin: 12px 0; white-space: pre-wrap; }
  .cls { display: block; text-align: left; width: 100%; border: 2px solid #E3E6EE; border-radius: 14px; padding: 12px 14px; margin: 0 0 8px; background: #fff; font: inherit; color: var(--ink); cursor: pointer; }
  .cls b { display: block; font-size: 16px; }
  .cls.on { border-color: var(--blue); background: var(--blue-l); }
  .loading { text-align: center; padding: 40px 0; color: var(--ink-2); }
  .spin { width: 34px; height: 34px; border: 4px solid var(--blue-l); border-top-color: var(--blue); border-radius: 50%; margin: 0 auto 10px; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/img/logo-color.webp" alt="サイエンス里山ラボ宗像">
  <div id="app"><div class="loading"><div class="spin"></div>読み込んでいます…</div></div>
</main>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="/assets/js/apply.js"></script>
<script>
const LIFF_ID = '2012556501-FSv5hUHg';
const API = 'https://script.google.com/macros/s/AKfycbxwrWoj9COdfvQTA8FFcYHzIxQurQJBEolSC26waR95pSui8ptOgZt_Z-cKKNqw6tVN/exec';
const LINE_ID = '@268rzaol';
const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdKTemHU1x4ZcK8WrYHPiplf-ZH3Ttc3h5IkumnMuz470D9SQ/viewform';
const FORM_LINE_ENTRY = 'entry.289709082';
const GRADES = ['0〜2歳', '年少', '年中', '年長', '小1', '小2', '小3', '小4', '小5', '小6', '中1', '中2以上'];
const LIFF_URL = 'https://liff.line.me/' + LIFF_ID;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
let classes = [], cls = null, state = null, sub = '';

function view(html) { app.innerHTML = html; window.scrollTo(0, 0); }
function loading(msg = '読み込んでいます…') { view(`<div class="loading"><div class="spin"></div>${esc(msg)}</div>`); }
function talkUrl(c) { return window.SATO_APPLY ? window.SATO_APPLY.url(LINE_ID, c) : `https://line.me/R/ti/p/${LINE_ID}`; }
function fail(msg, c) {
  view(`<div class="card"><h2>うまく開けませんでした</h2><p>${esc(msg)}</p>
    <p class="note">おそれいりますが、トークからお申し込みください。</p>
    <a class="btn line" href="${esc(talkUrl(c))}">LINEのトークで申し込む</a></div>`);
}

/* LINEとのつなぎこみが進まないとき */
function stuck() {
  const c = new URLSearchParams(location.search).get('c');
  view(`<div class="card"><h2>うまく開けていないようです</h2>
      <p class="sub">下のボタンから、もう一度開いてみてください。</p>
      <p style="margin:12px 0 8px"><a class="btn line" href="${esc(LIFF_URL + (c ? '?c=' + encodeURIComponent(c) : ''))}">申込画面を開き直す</a></p>
      <a class="btn sub" href="${esc(talkUrl(null))}">トークで申し込む</a>
      <p class="note" style="margin-top:10px">（${esc(navigator.userAgent.slice(0, 160))}）</p></div>`);
}

/* ───── サイトから来た人（LINEの外で開いたとき） ───── */
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const keep = (st => ({ get: k => { try { return st().getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { st().setItem(k, v); } catch (_) {} } }));
const local = keep(() => localStorage), session = keep(() => sessionStorage);
const paramC = () => new URLSearchParams(location.search).get('c');
const liffLink = () => LIFF_URL + (paramC() ? '?c=' + encodeURIComponent(paramC()) : '');
const BACK = '/#next';

function intro() {
  if (!isMobile) return pcOnly();
  if (session.get('sato_launched')) return launched();      // LINEからサイトに戻ってきたとき
  if (local.get('sato_intro_seen')) return launch();         // 2回目からは説明を出さずにLINEを開く
  view(`<div class="card"><h1>LINEで申し込む画面を開きます</h1>
      <p style="margin:10px 0">はじめて開くときだけ、LINEから<b>「サイエンス里山ラボ宗像」へのアクセスを許可するか</b>の確認画面が出ます。「許可する」を押すと申込画面に進みます。</p>
      <div class="sum" style="background:var(--sun-l)">🔒 里山ラボが受け取るのは、<b>LINEの表示名</b>と、<b>申し込みに使う番号</b>だけです。トークの内容や友だちの一覧を見ることはありません。</div>
      <a class="btn line" id="openLiff" href="${esc(liffLink())}">申込画面を開く</a>
      <p class="note" style="margin:12px 0 0">許可したくない場合は、これまでどおりトークからお申し込みいただけます。</p>
      <a class="btn sub" style="margin-top:8px" href="${esc(talkUrl(null))}">トークで申し込む</a>
      <p style="margin:14px 0 0;text-align:center"><a href="${BACK}">← サイトに戻る</a></p></div>`);
  $('#openLiff').onclick = () => { local.set('sato_intro_seen', '1'); session.set('sato_launched', '1'); setTimeout(launched, 1000); };
}
function launch() {
  session.set('sato_launched', '1');
  launched();
  location.href = liffLink();
}
function launched() {
  view(`<div class="card"><h2>LINEで申込画面を開いています</h2>
      <p class="sub">LINEが開かないときは、下のボタンを押してください。</p>
      <p style="margin:12px 0 8px"><a class="btn line" href="${esc(liffLink())}">LINEで申込画面を開く</a></p>
      <a class="btn sub" href="${BACK}">サイトに戻る</a>
      <p class="note" style="margin:12px 0 0;text-align:center"><a href="${esc(talkUrl(null))}">トークで申し込む</a>こともできます</p></div>`);
}
function pcOnly() {
  view(`<div class="card"><h2>スマートフォンのLINEで開いてください</h2>
      <p style="margin:10px 0">申込画面はスマートフォンのLINEの中で動くため、パソコンからは開けません。</p>
      <div class="sum" style="background:var(--sun-l)">📱 スマートフォンでサイトを開いて「LINEで申し込む」を押すか、LINEの里山ラボのトークで、下のメニューの「申し込む」からどうぞ。</div>
      <a class="btn sub" href="${BACK}">サイトに戻る</a></div>`);
}

/* サーバーとのやりとり。返事がない・おかしいときも止まらずに {ok:false} を返す */
async function api(action, body = {}) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action, idToken: liff.getIDToken(), ...body }), signal: ctl.signal });
    const t = await r.text();
    try { return JSON.parse(t); } catch (_) { console.warn(t.slice(0, 300)); return { ok: false, error: 'bad_response' }; }
  } catch (e) {
    console.warn(e); return { ok: false, error: 'network' };
  } finally { clearTimeout(timer); }
}

function label(c) { return window.SATO_APPLY ? window.SATO_APPLY.label(c) : c.title; }
function openClasses() {
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  return classes.filter(c => c.date >= today && !c.status).sort((a, b) => a.date.localeCompare(b.date));
}

/* ───── はじまり ───── */
(async () => {
  try {
    if (!API) return fail('申込画面の準備中です。');
    loading('LINEとつないでいます…');
    const slow = setTimeout(stuck, 15000);   // 15秒たっても進まないときは、開き直しの案内を出す
    await liff.init({ liffId: LIFF_ID });
    clearTimeout(slow);
    if (!liff.isLoggedIn()) {
      // LINEの中（LIFF）で開いたときはそのままログイン。サイトなどから来たときは、許可画面の前に説明を出す
      if (liff.isInClient()) { liff.login({ redirectUri: location.href }); return; }
      return intro();
    }
    const tok = liff.getDecodedIDToken(); sub = tok && tok.sub || '';
    // IDトークンの期限が切れていたら、ログインし直して新しいものをもらう
    if (tok && tok.exp && tok.exp * 1000 < Date.now() + 60000) {
      if (liff.isInClient()) return stuck();
      liff.logout(); liff.login({ redirectUri: location.href }); return;
    }
    loading('ご家族の情報を確認しています…');
    const [cj, me] = await Promise.all([fetch('/data/classes.json?t=' + Date.now()).then(r => r.json()), api('me')]);
    classes = Array.isArray(cj) ? cj : cj.classes;
    const want = new URLSearchParams(location.search).get('c');
    const open = openClasses();
    cls = open.find(c => c.id === want) || (open.length === 1 ? open[0] : null);
    if (!me.ok) return fail(me.error === 'auth' ? 'LINEの確認ができませんでした。もう一度開き直してください。' : '時間をおいて、もう一度お試しください。', cls);
    state = me;
    route();
  } catch (e) {
    console.error(e);
    fail('通信がうまくいきませんでした。', cls);
  }
})();

function route() {
  if (!openClasses().length) return view(`<div class="card"><h2>いま受付中の授業はありません</h2><p class="sub">つぎの授業が決まったら、LINEでお知らせします🌱</p></div>`);
  if (!cls) return pickClass();
  if (!state.linked) return linkForm();
  form();
}

/* ───── 授業をえらぶ ───── */
function pickClass() {
  view(`<div class="card"><h2>どの授業に申し込みますか？</h2>
    <p class="sub" style="margin-bottom:10px">1つずつ申し込めます。</p>
    ${openClasses().map(c => `<button class="cls" data-id="${esc(c.id)}"><b>${esc(label(c))}</b>${c.subtitle ? `<span class="note">${esc(c.subtitle)}</span>` : ''}${state && (state.applied || []).includes(c.id) ? '<span class="pill mem" style="margin:6px 0 0">申し込み済み</span>' : ''}</button>`).join('')}</div>`);
  app.querySelectorAll('.cls').forEach(b => b.onclick = () => { cls = classes.find(c => c.id === b.dataset.id); route(); });
}

/* ───── はじめて：名簿と結びつける ───── */
function linkForm(err = '') {
  view(`<div class="card"><span class="pill">はじめての方</span><h1>${esc(label(cls))}</h1></div>
    <div class="card"><h2>はじめに、ご家族を確認させてください</h2>
      <p class="sub">次からは、来る人にチェックするだけで申し込めます。</p>
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      <div style="margin-top:14px">
        <label class="field"><span>保護者のお名前（フルネーム）</span><input type="text" id="lp" placeholder="例：里山花子" autocomplete="name"></label>
        <label class="field"><span>お子さまのお名前（どなたか1人・下の名前だけでもOK）</span><input type="text" id="lc" placeholder="例：たろう"></label>
        <p class="note" style="margin:-4px 0 12px">スペースはあってもなくても大丈夫です。漢字・ひらがな・カタカナ、どれでも探せます。</p>
      </div>
      <button class="btn" id="lgo">確認する</button>
    </div>
    <div class="card"><h2>はじめて参加する方・まだ会員でない方</h2>
      <p class="sub">トークからお申し込みください。入会をご希望の方は入会フォームへどうぞ。</p>
      <p style="margin:12px 0 8px"><a class="btn line" href="${esc(talkUrl(cls))}">LINEのトークで申し込む</a></p>
      <a class="btn sub" href="${esc(FORM_URL + '?usp=pp_url&' + FORM_LINE_ENTRY + '=' + encodeURIComponent(sub))}" target="_blank" rel="noopener">入会フォームを開く</a>
    </div>`);
  $('#lgo').onclick = async () => {
    const parent = $('#lp').value.trim(), child = $('#lc').value.trim();
    if (!parent || !child) return linkForm('保護者とお子さまのお名前を入れてください。');
    loading('確認しています…');
    const r = await api('link', { parent, child });
    if (r.ok && r.linked) { state = r; return form(); }
    linkForm(r.error === 'notfound' ? '名簿の中に見つかりませんでした。入会フォームの内容と同じ書き方で入れてみてください（ひらがなでもOKです）。' : 'うまく確認できませんでした。もう一度お試しください。');
  };
}

/* ───── 来る人にチェック ───── */
let extra = { a: 0, k: 0 };
function form(err = '') {
  const f = state.family, kids = f.members.filter(m => m.kind === '子ども'), adults = f.members.filter(m => m.kind === '大人');
  const again = (state.applied || []).includes(cls.id);
  const chk = m => `<label class="chk"><input type="checkbox" value="${esc(m.id)}" ${m.kind === '子ども' ? 'checked' : ''}><span><b>${esc(m.name)}</b>${m.grade ? `<small>${esc(m.grade)}</small>` : m.relation && m.relation !== '保護者' ? `<small>${esc(m.relation)}</small>` : ''}</span></label>`;
  view(`<div class="card"><span class="pill">${esc(f.member ? '会員' : 'お申し込み')}</span>${f.member ? '' : ''}
      <h1>${esc(label(cls))}</h1>${cls.subtitle ? `<p class="sub">${esc(cls.subtitle)}</p>` : ''}
      ${openClasses().length > 1 ? '<button class="linkbtn" id="chg">ほかの授業をえらぶ</button>' : ''}</div>
    ${again ? '<div class="err" style="background:var(--sun-l);color:var(--ink)">この授業にはもう申し込んでいます。送り直すと、新しい内容に変わります。</div>' : ''}
    <div class="card"><h2>${esc(f.name)}さんのご家族　来る人にチェック</h2>
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      ${kids.length ? `<div class="group">お子さま</div>${kids.map(chk).join('')}` : ''}
      ${adults.length ? `<div class="group">大人</div>${adults.map(chk).join('')}` : ''}
      <button class="linkbtn" id="addm">＋ 家族を登録する（きょうだい・祖父母など）</button>
      <div id="addbox" hidden style="margin-top:8px">
        <div class="field"><span>区分</span><select id="ak"><option>子ども</option><option>大人</option></select></div>
        <label class="field"><span>お名前</span><input type="text" id="an"></label>
        <div class="field" id="agw"><span>学年</span><select id="ag"><option value="">えらんでください</option>${GRADES.map(g => `<option>${g}</option>`).join('')}</select></div>
        <div class="field" id="arw" hidden><span>続柄</span><select id="ar"><option>父</option><option>母</option><option>祖父</option><option>祖母</option><option>その他</option></select></div>
        <button class="btn sub" id="asave">登録する</button>
      </div>
      <div class="group" style="margin-top:16px">登録していない人も来る</div>
      <div class="row"><span>大人</span><span class="stepper"><button data-s="a-">−</button><output id="xa">${extra.a}</output><button data-s="a+">＋</button></span></div>
      <div class="row"><span>子ども</span><span class="stepper"><button data-s="k-">−</button><output id="xk">${extra.k}</output><button data-s="k+">＋</button></span></div>
      <label class="field" style="margin-top:12px"><span>連絡事項（任意）</span><textarea id="note" maxlength="300" placeholder="アレルギーや、遅れて来るなど"></textarea></label>
      <div class="fee" id="fee"></div>
      ${f.member ? '' : `<p class="note" style="margin:-6px 0 14px">🌱 会員になると、授業料が1回3,000円になります（年会費1,000円）。<a href="${esc(FORM_URL + '?usp=pp_url&' + FORM_LINE_ENTRY + '=' + encodeURIComponent(sub))}" target="_blank" rel="noopener">入会のご案内</a></p>`}
      <div class="err" id="ferr" hidden></div>
      <button class="btn line" id="go">この内容で申し込む</button>
      <p class="note" style="margin:10px 0 0">参加費は当日受付でお支払いください。くわしい集合場所や持ち物は、授業の前日までにLINEでご案内します。<br>申し込んだあとにキャンセルするときは、LINEのトークでご連絡ください。</p>
    </div>`);
  $('#chg') && ($('#chg').onclick = () => { cls = null; pickClass(); });
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const [k, op] = [b.dataset.s[0], b.dataset.s[1]];
    extra[k] = Math.max(0, Math.min(10, extra[k] + (op === '+' ? 1 : -1)));
    $('#x' + k).value = extra[k]; $('#x' + k).textContent = extra[k];
    showFee();
  });
  /* 参加費のめやす（サーバーの計算と同じ決まり）。チェックや人数を変えるたびに出し直す */
  const showFee = () => {
    const ids = [...app.querySelectorAll('label.chk input:checked')].map(i => i.value);
    const ck = kids.filter(m => ids.includes(m.id));
    const pre = g => ['0〜2歳', '年少', '年中', '年長'].includes(g) || /歳/.test(g || '');
    const school = ck.filter(m => !pre(m.grade)).length, preN = ck.length - school;
    let html;
    if (!school && !extra.k) html = preN ? '未就学のお子さまのみ（当日ご相談ください）' : 'お子さまにチェックすると表示されます';
    else {
      const total = (f.member ? 3000 : 4000) + Math.max(0, school - 2) * 500;
      html = `<b>${total.toLocaleString()}円</b>（${f.member ? '会員' : '会員以外'}${school > 2 ? `・お子さま${school}人` : ''}）`;
      if (preN) html += '<br><span class="note">未就学のお子さまは無料です</span>';
      if (extra.k) html += '<br><span class="note">登録していないお子さまの分は、当日おうかがいします</span>';
    }
    $('#fee').innerHTML = `参加費のめやす：${html}`;
  };
  app.querySelectorAll('label.chk input').forEach(i => i.onchange = showFee);
  showFee();
  $('#addm').onclick = () => { $('#addbox').hidden = !$('#addbox').hidden; };
  $('#ak').onchange = () => { const adult = $('#ak').value === '大人'; $('#agw').hidden = adult; $('#arw').hidden = !adult; };
  $('#asave').onclick = async () => {
    // 画面を切りかえる前に、入力欄の中身を読んでおく
    const name = $('#an').value.trim(); if (!name) return;
    const body = { kind: $('#ak').value, name, grade: $('#ag').value, relation: $('#ar').value.trim() };
    loading('登録しています…');
    const r = await api('addMember', body);
    if (r.ok) { state = r; form(); } else form(r.error === 'network' || r.error === 'bad_response' ? '通信がうまくいきませんでした。もう一度お試しください。' : '登録できませんでした。');
  };
  $('#go').onclick = async () => {
    const ids = [...app.querySelectorAll('label.chk input:checked')].map(i => i.value);
    const adultIds = f.members.filter(m => m.kind === '大人').map(m => m.id);
    // 入力は消さずに、ボタンのすぐ上にお知らせを出す
    const warn = msg => { const e = $('#ferr'); e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
    if (!ids.length && !extra.a && !extra.k) return warn('来る人にチェックしてください。');
    if (!ids.some(id => adultIds.includes(id)) && !extra.a) return warn('いっしょに来る大人の方（保護者）を、1人以上チェックしてください。');
    const note = $('#note').value.trim();
    loading('送っています…');
    const r = await api('apply', { classId: cls.id, memberIds: ids, extraAdults: extra.a, extraKids: extra.k, note });
    if (!r.ok) return form(r.error === 'closed' ? 'この授業の受付は終わっています。' : r.error === 'no_adult' ? 'いっしょに来る大人の方（保護者）を、1人以上チェックしてください。' : '送れませんでした。もう一度お試しください。');
    done(r);
  };
}

/* ───── 申込完了 ───── */
async function done(r) {
  state.applied = [...new Set([...(state.applied || []), cls.id])];
  const others = openClasses().filter(c => !state.applied.includes(c.id));
  const text = ['🌱授業の申し込み（かんたん申込）', ...r.summary].join('\n');
  let sent = false;
  try {
    const ctx = liff.getContext();
    if (ctx && ['utou', 'room', 'group'].includes(ctx.type) && liff.isApiAvailable('sendMessages')) { await liff.sendMessages([{ type: 'text', text }]); sent = true; }
  } catch (e) { console.warn(e); }
  try { if (window.gtag) gtag('event', 'apply_complete', { class_title: r.label }); } catch (_) {}
  view(`<div class="card done"><img src="/assets/img/chara/blue-3.webp" alt="">
      <h1>${r.changed ? '申し込みの内容を変えました' : 'お申し込みを受け付けました'}</h1>
      <div class="sum">${esc(r.summary.join('\n'))}</div>
      <p class="sub">${sent ? 'トークにも内容を送りました。' : ''}担当者から、LINEで受付のご連絡をします🌱</p>
      <div class="sum" style="background:var(--sun-l)">🙏 キャンセルするときは、LINEのトークでメッセージをお送りください。</div>
      ${others.length ? '<p style="margin-top:16px"><button class="btn" id="more">ほかの授業にも申し込む</button></p>' : ''}
      ${liff.isInClient() ? '<p style="margin-top:12px"><button class="btn sub" id="close">とじる</button></p>' : `<p style="margin-top:12px"><a class="btn sub" href="${BACK}">サイトに戻る</a></p>`}</div>`);
  $('#close') && ($('#close').onclick = () => liff.closeWindow());
  $('#more') && ($('#more').onclick = () => { cls = null; extra = { a: 0, k: 0 }; pickClass(); });
}
</script>
</body>
</html>
